    <!--
      Structured data. Every claim here must stay in sync with what is actually rendered on the
      landing page - Google treats structured data that contradicts visible content as spam. The
      offers below mirror the pricing section (Free / $19 / $49 per month). Deliberately no
      aggregateRating: there are testimonials on the page but no real collected ratings, and
      inventing them risks a manual action.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://dev-diary.in/#organization",
            "name": "Dev Diary",
            "url": "https://dev-diary.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://dev-diary.in/og-image.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://dev-diary.in/#website",
            "url": "https://dev-diary.in/",
            "name": "Dev Diary",
            "description": "Interview preparation for software engineers",
            "publisher": { "@id": "https://dev-diary.in/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://dev-diary.in/#webapp",
            "name": "Dev Diary",
            "url": "https://dev-diary.in/",
            "applicationCategory": "EducationalApplication",

                "description": "Perfect for beginners"
              },
              {

                "name": "Pro",

                "priceCurrency": "USD",
                "description": "For serious candidates"
              },
              {

                "price": "49",
                "priceCurrency": "USD",
                "description": "For teams & professionals"

            ]
          }
        ]
